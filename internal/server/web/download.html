<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.FileName}} - qshare</title>

  <style>
    :root {
      font-family:
        system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      color: #202124;
    }

    main {
      box-sizing: border-box;
      width: min(92vw, 420px);
      padding: 32px 24px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px rgb(0 0 0 / 10%);
      text-align: center;
    }

    .brand {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.2rem;
    }

    .file-name {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.25rem;
    }

    .file-size {
      margin: 8px 0 28px;
      color: #6b7280;
    }

    .download {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    .notice {
      margin: 24px 0 0;
      color: #6b7280;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #f9fafb;
      }

      main {
        background: #1f2937;
      }

      .file-size,
      .notice {
        color: #9ca3af;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="brand">Qshare</p>

    <p class="file-name">{{.FileName}}</p>
    <p class="file-size">{{.FileSize}}</p>
    
    <a href="{{.DownloadURL}}" class="download">Download</a>
    <p class="notice">This file is being shared temporarily.</p>
  </main>
</body>
