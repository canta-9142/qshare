<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Shared text - Qshare</title>

  {{template "common-style" .}}
  <style>
    .shared-text {
      margin: 0;
      padding: 24px 0;
      border-block: 1px solid currentColor;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font: inherit;
    }

  </style>
</head>
<body>
  <main>
    <p class="brand">Qshare - Shared text</p>
    <pre id="shared-text" class="shared-text">{{.Text}}</pre>
    <button id="copy" class="action" type="button">Copy</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const text = document.querySelector("#shared-text");
    const button = document.querySelector("#copy");
    const status = document.querySelector("#status");

    button.addEventListener("click", async () => {
      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(text.textContent);
        } else {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(text);
          selection.removeAllRanges();
          selection.addRange(range);
          if (!document.execCommand("copy")) {
            throw new Error("copy command failed");
          }
          selection.removeAllRanges();
        }
        status.textContent = "Copied.";
      } catch {
        status.textContent = "Copy failed. Select the text and copy it manually.";
      }
    });
  </script>
</body>
</html>
