<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Send Files - Qshare</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: light dark;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
    }

    main {
      width: min(100% - 32px, 560px);
      margin: 64px auto;
    }

    h1 {
      margin: 0 0 40px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    section {
      border-top: 1px solid currentColor;
      padding-top: 24px;
    }

    section + section {
      margin-top: 48px;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 1.125rem;
    }

    input,
    textarea,
    button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
    }

    input {
      margin-bottom: 24px;
    }

    textarea {
      min-height: 160px;
      margin-bottom: 24px;
      padding: 8px;
      resize: vertical;
    }

    button {
      padding: 12px;
      border: 1px solid currentColor;
      border-radius: 0;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    progress {
      width: 100%;
      margin-top: 24px;
    }

    .status {
      min-height: 1.5em;
      margin-top: 16px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
        color: #eee;
      }

      button {
        background: #eee;
        color: #111;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Send a file</h1>

    <section>
      <h2>File</h2>
      <form id="upload" action="{{.UploadURL}}" method="post"
            enctype="multipart/form-data">
        <input id="file" type="file" name="file" required>
        <button type="submit">Upload</button>
      </form>

      <progress id="progress" max="100" value="0" hidden></progress>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section>
      <h2>Text</h2>
      <form id="text-form" action="{{.TextURL}}" method="post">
        <textarea id="text" name="text" maxlength="1048576" required></textarea>
        <button type="submit">Send text</button>
      </form>
      <p id="text-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#upload");
    const fileInput = document.querySelector("#file");
    const uploadButton = form.querySelector('button[type="submit"]');
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const maxUploadSize = 1024 * 1024 * 1024;

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return `${Math.round(bytes)} B`;
      }

      const units = ["KiB", "MiB", "GiB"];
      let value = bytes;
      let unit = "B";
      for (let index = 0; index < units.length; index++) {
        value /= 1024;
        unit = units[index];
        if (value < 1024 || index === units.length - 1) {
          break;
        }
      }
      return `${value.toFixed(1)} ${unit}`;
    }

    function selectedFileIsTooLarge() {
      const [file] = fileInput.files;
      return file && file.size > maxUploadSize;
    }

    fileInput.addEventListener("change", () => {
      if (selectedFileIsTooLarge()) {
        uploadButton.disabled = true;
        uploadButton.textContent = "Cannot upload";
        status.textContent = "The file is too large. The maximum size is 1 GiB.";
        return;
      }

      uploadButton.disabled = false;
      uploadButton.textContent = "Upload";
      status.textContent = "";
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (selectedFileIsTooLarge()) {
        uploadButton.disabled = true;
        uploadButton.textContent = "Cannot upload";
        status.textContent = "The file is too large. The maximum size is 1 GiB.";
        return;
      }

      const formData = new FormData(form);
      const request = new XMLHttpRequest();
      request.open("POST", form.action);
      const uploadStartedAt = performance.now();

      fileInput.disabled = true;
      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading…";
      progress.hidden = false;
      progress.value = 0;
      status.textContent = "Uploading…";

      request.upload.addEventListener("progress", event => {
        const elapsedSeconds = (performance.now() - uploadStartedAt) / 1000;
        const averageSpeed = elapsedSeconds > 0 ? event.loaded / elapsedSeconds : 0;

        if (event.lengthComputable) {
          const percentage = event.loaded / event.total * 100;
          progress.value = percentage;
          const transferred = `${formatBytes(event.loaded)} / ${formatBytes(event.total)}`;
          status.textContent = `Uploading… ${Math.round(percentage)}% · ${transferred} · ${formatBytes(averageSpeed)}/s`;
          return;
        }

        status.textContent = `Uploading… ${formatBytes(event.loaded)} transferred · ${formatBytes(averageSpeed)}/s`;
      });

      request.addEventListener("load", () => {
        if (request.status !== 201) {
          uploadButton.textContent = "Retry upload";
          switch (request.status) {
          case 400:
            status.textContent = "The selected file could not be uploaded.";
            break;
          case 404:
            status.textContent = "This sharing session has expired or is unavailable.";
            break;
          case 413:
            status.textContent = "The file is too large. The maximum size is 1 GiB.";
            break;
          case 500:
            status.textContent = "The file could not be saved on the computer.";
            break;
          default:
            status.textContent = "Upload failed. Please try again.";
          }
          return;
        }

        let result;
        try {
          result = JSON.parse(request.responseText);
        } catch {
          uploadButton.textContent = "Retry upload";
          status.textContent = "The computer returned an invalid response. Please try again.";
          return;
        }
        if (typeof result.name !== "string" || result.name === "") {
          uploadButton.textContent = "Retry upload";
          status.textContent = "The computer returned an invalid response. Please try again.";
          return;
        }
        uploadButton.textContent = "Upload";
        status.textContent = `Saved as ${result.name}`;
        form.reset();
        progress.value = 100;
      });

      request.addEventListener("error", () => {
        uploadButton.textContent = "Retry upload";
        status.textContent = "The connection was lost. Check the network and try again.";
      });

      request.addEventListener("loadend", () => {
        fileInput.disabled = false;
        uploadButton.disabled = false;
      });

      request.send(formData);
    });

    const textForm = document.querySelector("#text-form");
    const textInput = document.querySelector("#text");
    const textStatus = document.querySelector("#text-status");

    textForm.addEventListener("submit", async event => {
      event.preventDefault();
      textStatus.textContent = "Sending…";

      try {
        const response = await fetch(textForm.action, {
          method: "POST",
          headers: {"Content-Type": "text/plain; charset=utf-8"},
          body: textInput.value,
        });
        if (!response.ok) {
          throw new Error("submission failed");
        }
        textStatus.textContent = "Text sent.";
        textForm.reset();
      } catch {
        textStatus.textContent = "Text submission failed.";
      }
    });
  </script>
</body>
</html>
