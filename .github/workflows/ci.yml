name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, vet, and race
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Test installer
        run: sh tests/install_test.sh

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  build:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          version=devel
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=$GITHUB_REF_NAME
          fi
          go build \
            -trimpath \
            -ldflags "-X main.version=${version}" \
            -o "dist/qshare-linux-${GOARCH}" \
            ./cmd/qshare

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: qshare-linux-${{ matrix.goarch }}
          path: dist/qshare-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

      - name: Build and check
        run: nix flake check --print-build-logs
